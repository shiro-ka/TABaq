<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新しいタブ</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="wall"></div>
  <div class="screen">
    <div class="bar">
      <button class="bar-btn bar-add" type="button">足す</button>
      <button class="bar-btn bar-drawer" type="button">ブックマーク</button>
      <button class="bar-btn bar-settings" type="button">設定</button>
    </div>
    <div class="pages"><div class="track"></div></div>
    <div class="dots"></div>
  </div>
  <aside class="drawer" aria-label="ブックマーク">
    <div class="drawer-head">
      <h2>ブックマーク</h2>
      <button class="round drawer-close" type="button" aria-label="閉じる">✕</button>
    </div>
    <p class="drawer-note">ドラッグで好きな升目に、押すと空いている升目に置きます。</p>
    <input class="drawer-search" type="search" placeholder="名前や URL で探す" aria-label="ブックマークを探す">
    <div class="drawer-list"></div>
  </aside>
  <script type="module" src="newtab.js"></script>
</body>
</html>
